name: winget

# Tries Oriel's winget package on real Windows (x64 and ARM) before it goes to
# microsoft/winget-pkgs: validates the manifests, installs from them silently,
# shows what the installer wrote in the registry (where the ProductCode and the
# Apps & features entry come from), then uninstalls. The manifests are read
# from a branch of carpaaaaa/winget-pkgs.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of carpaaaaa/winget-pkgs with the manifests
        required: true
      version:
        description: Oriel version in the manifests
        required: true

permissions:
  contents: read

jobs:
  # The installer on its own, the ways winget and the tests start it: with
  # the switches winget passes, without them, and with the download mark that
  # winget puts on the file.
  direct:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: The installer alone
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.os }}' -match 'arm') { 'arm64' } else { 'x64' }
          $f = Join-Path $env:RUNNER_TEMP 'Oriel-Setup.exe'
          Invoke-WebRequest "https://github.com/carpaaaaa/oriel/releases/download/v${{ inputs.version }}/Oriel-Setup-${{ inputs.version }}-$arch.exe" -OutFile $f -MaximumRetryCount 5 -RetryIntervalSec 5
          function Attempt($label, $a) {
            $p = Start-Process -FilePath $f -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(150000)) {
              "${label}: still running after 2.5 minutes. Windows open:"
              Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Oriel|Setup|^ns|Un_' } | Format-Table Name, ProcessId, ParentProcessId, CommandLine -AutoSize -Wrap
              Get-Process | Where-Object { $_.Path -like "$env:TEMP*" -or $_.Path -like "$env:RUNNER_TEMP*" } | Stop-Process -Force -ErrorAction SilentlyContinue
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              return
            }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\Oriel\Oriel.exe'
            "${label}: exit $($p.ExitCode), Oriel.exe installed: $(Test-Path $exe)"
            $un = Join-Path $env:LOCALAPPDATA 'Programs\Oriel\Uninstall Oriel.exe'
            if (Test-Path $un) { Start-Process $un -ArgumentList '/S' -Wait; Start-Sleep 8 }
          }
          Attempt '/S' @('/S')
          Attempt '/S /currentuser' @('/S', '/currentuser')
          Set-Content -Path $f -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          Attempt '/S, marked as downloaded' @('/S')

  manifest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      # The runners' winget is old (1.11 on x64, none on ARM) and doesn't know
      # the manifest schema winget-pkgs uses now: the latest one, as people have.
      # On Windows Server (x64) the update can fail; 1.11 then reads the
      # manifests with a warning about the schema and installs from them.
      - name: WinGet, latest
        continue-on-error: true
        shell: pwsh
        run: |
          Install-PSResource -Name Microsoft.WinGet.Client -TrustRepository -Quiet
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -AllUsers -Latest -Force
      - name: WinGet, ready
        shell: pwsh
        run: |
          winget --version
          winget settings --enable LocalManifestFiles
      - name: Manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory manifests | Out-Null
          foreach ($f in 'CharStudio.Oriel.yaml', 'CharStudio.Oriel.installer.yaml', 'CharStudio.Oriel.locale.en-US.yaml') {
            Invoke-WebRequest "https://raw.githubusercontent.com/carpaaaaa/winget-pkgs/${{ inputs.branch }}/manifests/c/CharStudio/Oriel/${{ inputs.version }}/$f" -OutFile "manifests/$f" -MaximumRetryCount 5 -RetryIntervalSec 5
          }
      - name: Validate
        shell: pwsh
        run: |
          $out = winget validate --manifest manifests | Out-String
          $out
          if ($out -notmatch 'Manifest validation succeeded') { exit 1 }
          exit 0
      # On this test machine only. The installer isn't code-signed, so
      # SmartScreen holds it at "Windows protected your PC" (More info, Run
      # anyway), which on a runner nobody can click: winget sat at "Starting
      # package install..." with CHXSmartScreen open. People installing with
      # winget see the same question as from the website, until Oriel is signed.
      # Then, with SmartScreen off, winget's own window "Open File - Security
      # Warning" (unknown publisher), because winget marks the file as
      # downloaded: the Attachment Manager is told not to keep that mark here.
      - name: SmartScreen and the download mark off (test machine only)
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' -Name EnableSmartScreen -Value 0 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' -Name SmartScreenEnabled -Value 'Off'
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments' -Name SaveZoneInformation -Value 1 -Type DWord
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Associations' -Name LowRiskFileTypes -Value '.exe'
      - name: Install
        timeout-minutes: 8
        shell: pwsh
        run: |
          $p = Start-Process winget -ArgumentList 'install', '--manifest', 'manifests', '--silent', '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity', '--verbose-logs' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(240000)) {
            'Still installing after 4 minutes. Windows open:'
            Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'Oriel|Setup|winget|^ns|Un_' } | Format-Table Name, ProcessId, ParentProcessId, CommandLine -AutoSize -Wrap
            exit 1
          }
          exit $p.ExitCode
      - name: What the installer wrote
        shell: pwsh
        run: |
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Oriel*' } |
            Select-Object PSChildName, DisplayName, DisplayVersion, Publisher, InstallLocation, QuietUninstallString | Format-List
          'Offered to Windows as a browser:'
          Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue | Select-Object Oriel | Format-List
          Get-ItemProperty 'HKCU:\Software\Clients\StartMenuInternet\Oriel\Capabilities\URLAssociations' -ErrorAction SilentlyContinue | Select-Object http, https, mailto | Format-List
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Oriel\Oriel.exe'
          if (-not (Test-Path $exe)) { throw "Oriel.exe isn't at $exe" }
          (Get-Item $exe).VersionInfo | Format-List FileVersion, ProductVersion, CompanyName, ProductName
      - name: What winget lists
        continue-on-error: true
        run: winget list --name Oriel --accept-source-agreements --disable-interactivity
      - name: Uninstall
        run: winget uninstall --manifest manifests --silent --disable-interactivity
      - name: Gone
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Oriel\Oriel.exe')) { throw 'Oriel.exe is still there' }
          $left = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Oriel*' }
          if ($left) { throw 'The Apps & features entry is still there' }
          'Uninstalled cleanly'
      - name: What was running, if it stalled
        if: failure() || cancelled()
        shell: pwsh
        run: Get-Process | Where-Object { $_.ProcessName -match 'Oriel|winget|AppInstaller|Setup|Un_A|nsis|smartscreen|consent' } | Format-Table ProcessName, Id, StartTime, Path -AutoSize
      - name: winget's logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: winget-logs-${{ matrix.os }}
          path: ~\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir\
          if-no-files-found: ignore
