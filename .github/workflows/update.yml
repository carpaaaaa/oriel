name: update

# Automatic updates for real (test/update_real.py): the release before the
# newest one is installed with its installer on real Windows, finds the
# newest on GitHub, downloads it, shows the popup and becomes it. Runs when a
# release has been published (release.yml) and by hand, from any version.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      from:
        description: 'The installed version that should update (empty: the release before the newest)'
        required: false
        default: ''

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: update (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versions
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
        run: |
          to=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          from="$FROM"
          if [ -z "$from" ]; then from=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases -L 2 --json tagName --jq '.[1].tagName'); fi
          echo "to=${to#v}" >> "$GITHUB_OUTPUT"
          echo "from=${from#v}" >> "$GITHUB_OUTPUT"
          echo "from ${from#v} to ${to#v}"
      - name: An installed Oriel updates itself
        env:
          SHOTS_DIR: shots
        run: python test/update_real.py ${{ steps.v.outputs.from }} ${{ steps.v.outputs.to }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-${{ matrix.os }}
          path: shots/
