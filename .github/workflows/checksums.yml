name: checksums

# SHA256SUMS.txt for a release that was published without one (the checksums
# step of release.yml makes it for the next ones): the installers are
# downloaded, hashed, and the list is added to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.11
        required: true

permissions:
  contents: write

jobs:
  sums:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl
          gh release download "${{ inputs.tag }}" --dir dl --pattern 'Oriel-Setup-*.exe' --pattern 'Oriel-Portable-*.exe'
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/checksums.mjs dl | tee SHA256SUMS.txt
          gh release upload "${{ inputs.tag }}" SHA256SUMS.txt --clobber
