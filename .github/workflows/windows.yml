name: windows

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Fase 0, core
        env:
          SHOTS_DIR: shots
        run: |
          mkdir shots
          python test/f0_core.py
      - name: Tour (screenshots)
        if: always()
        env:
          SHOTS_DIR: shots
        run: python test/tour.py
      - name: Data, Windows Hello and the Windows password
        if: always()
        run: python test/data_windows.py
      - name: Data, passwords from other browsers (DPAPI v10, v20, Firefox, CSV)
        if: always()
        run: python test/data_passwords_import.py
      - name: Data, bringing things over
        if: always()
        run: python test/data_import.py
      - name: Data, history and bookmarks
        if: always()
        run: python test/data_places.py
      - name: Data, passwords in pages
        if: always()
        run: python test/data_fill.py
      - name: Data, the bookmark button beside the window's buttons, removing bookmarks
        if: always()
        run: python test/data_bookmarks_door.py
      - name: Data, the bookmark button while the column slides away
        if: always()
        run: python test/data_bookmarks_fold.py
      - name: Hide elements on sites, kept for each site (Ctrl+Shift+H, Ctrl+Shift+U, right click)
        if: always()
        run: python test/pages_hide.py
      - name: A page not painted yet shows the dark, not white (dark ground while loading)
        if: always()
        run: python test/pages_ground.py
      - name: See through the floating video away from the pointer (Oriel's window, picture in picture)
        if: always()
        run: python test/pages_float_fade.py
      - name: "The floating video: one switch, its buttons in Oriel's look, off means nothing floats"
        if: always()
        run: python test/pages_float_look.py
      - name: "The floating video's switch from the old choice"
        if: always()
        run: python test/settings_float_migrate.py
      - name: "Always show the address bar"
        if: always()
        run: python test/ui_address_line.py
      - name: "Show how far you've read, in the column and across the top"
        if: always()
        run: python test/tabs_reading.py
      - name: "Scroll with the middle button stays off when it is off"
        if: always()
        run: python test/pages_autoscroll_off.py
      - name: "Thin scrollbars, a site's own kept (a picture of the page with it)"
        if: always()
        env:
          SHOTS_DIR: shots
        run: python test/pages_scrollbar.py
      - name: "Hide YouTube Shorts"
        if: always()
        run: python test/pages_shorts.py
      - name: "A private tab: the Jump List's flags, Ctrl+Shift+N, the note on its blank page"
        if: always()
        run: python test/launch_private.py
      - name: A tab carried onto the page splits it; the divider; the X on picked tabs
        if: always()
        run: python test/split_drop.py
      - name: Maximize, full screen and back, Restore Down; the size windows.json keeps
        if: always()
        run: python test/window_restore_full.py
      - name: "Split view drawn as one in the tabs list, in the column and across the top"
        if: always()
        run: python test/tabs_split_joined.py
      - name: "A click outside lets picked tabs go"
        if: always()
        run: python test/tabs_pick_clear.py
      - name: "Borderless window keeps the taskbar within reach; full screen as before"
        if: always()
        run: python test/window_borderless.py
      - name: The bookmarks bar above the page
        if: always()
        run: python test/bookmarks_bar.py
      - name: Everything kept for the next launch (quit, session end, monitors, full screen, Snap)
        if: always()
        run: python test/persist_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: |
            shots/
            out/*.log

  # Isolation and safety on real Windows (studio/09 §5): Oriel's own pages
  # apart from websites, site permissions, the guards of the interface and of
  # oriel://, test knobs, atomic writes, extensions' network rules, updates
  # (the portable copy too) and the licenses.
  security:
    name: security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Oriel's own pages, apart from websites
        run: python test/settings_pages.py
      - name: Guards (interface, oriel:// from sites, test knobs)
        if: always()
        run: python test/security_guards.py
      - name: Site permissions
        if: always()
        run: python test/settings_permissions.py
      - name: Writes that can't be cut in half
        if: always()
        run: python test/robust_writes.py
      - name: Extensions, declarativeNetRequest (regexes that can't freeze the browser)
        if: always()
        run: python test/extensions_dnr.py
      - name: Updates (and the portable copy)
        if: always()
        run: python test/settings_d_updates.py
      - name: Licenses
        if: always()
        run: python test/licenses_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ matrix.os }}
          path: out/*.log

  # The window drawn by Oriel on real Windows: the frame with the bench, then
  # real input from the operating system and pictures of the whole screen
  # (corners and shadow as Windows composes them), for each variant of the
  # frame (src/main/window/frame.ts).
  window:
    name: window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Screen
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' | Format-List WindowArrangementActive, DragFullWindows
          # A fresh Windows 11 image can still show the first-run privacy
          # screen over everything: close it.
          Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, Name, MainWindowTitle
          Get-Process WWAHost, CloudExperienceHostBroker, UserOOBEBroker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: A video's own full screen, the page over the whole screen (real input)
        env:
          SHOTS_DIR: shots
        run: python test/video_fullscreen.py
      - name: Every resize of the window, full screen in and out every way (real input)
        if: always()
        run: python test/window_resize_all.py
      - name: Frame (bench)
        if: always()
        env:
          SHOTS_DIR: shots
        run: python test/window_frame.py
      - name: Split View (bench)
        if: always()
        env:
          SHOTS_DIR: shots
        run: python test/window_split.py
      - name: Page zoom (bench)
        if: always()
        run: python test/window_zoom.py
      - name: Page zoom with Ctrl+wheel, the capsule that says it (real wheel events)
        if: always()
        env:
          SHOTS_DIR: shots
        run: python test/window_zoom_pill.py
      - name: States in a row, the buttons and doors always there (bench)
        if: always()
        run: python test/window_states.py
      - name: Real input, frame as shipped
        if: always()
        env:
          SHOTS_DIR: shots
          FRAME_VARIANT: thick
        run: python test/window_os.py
      - name: Real input, frame as shipped, dark
        if: always()
        continue-on-error: true
        env:
          SHOTS_DIR: shots
          FRAME_VARIANT: thick-dark
          FRAME_LOOK: dark
        run: python test/window_os.py
      - name: Real input, plain transparent window
        if: always()
        continue-on-error: true
        env:
          SHOTS_DIR: shots
          FRAME_VARIANT: plain
          SEARCH_FRAME_STYLE: plain
        run: python test/window_os.py
      - name: Real input, maximize emulated by Electron
        if: always()
        continue-on-error: true
        env:
          SHOTS_DIR: shots
          FRAME_VARIANT: thick-emulated-max
          SEARCH_FRAME_MAX: emulated
        run: python test/window_os.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-${{ matrix.os }}
          path: |
            shots/
            out/*.log

  # Ctrl+Tab and the switcher, the tab numbers and the number keys,
  # with real keys, mouse and touch from Windows (test/real_switcher.py).
  keys:
    name: keys (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Ctrl+Tab, tab numbers and number keys (real input)
        timeout-minutes: 9
        env:
          SHOTS_DIR: shots
          PYTHONUNBUFFERED: '1'
        run: python test/real_switcher.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keys-${{ matrix.os }}
          path: |
            shots/
            out/*.log

  # The Microsoft Store's package (package.json build.appx): made for each
  # processor, signed with a test certificate of the Store's publisher,
  # installed, opened from the Start menu, uninstalled. The unsigned packages
  # are kept: they are what goes to Partner Center (the Store signs them).
  store:
    name: store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win appx --${{ matrix.arch }} --publish never
      - name: The Store's package installed, opened and uninstalled
        timeout-minutes: 10
        env:
          SHOTS_DIR: shots
          PYTHONUNBUFFERED: '1'
        run: python test/store_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-${{ matrix.arch }}
          path: |
            dist/*.appx
            shots/

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # koffi's prebuilt binary for the other architecture too (npm only
      # installs the one of the machine it runs on).
      - run: npm install --no-save --force @koromix/koffi-win32-x64@3.3.8 @koromix/koffi-win32-arm64@3.3.8
      # The list that ships, made here, after both koffi binaries are in.
      - run: node scripts/licenses.mjs --expect @koromix/koffi-win32-x64,@koromix/koffi-win32-arm64
      - run: npm run build
      - run: npx electron-builder --win nsis portable --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
      # Oriel as the default browser (studio/07 4.1): the x64 setup installed
      # with /S lists Oriel among Windows' browsers; Settings opens on its page,
      # Set default is pressed there, links and .html files open in Oriel;
      # the uninstaller takes the keys away.
      - name: Default browser (installed, Set default, links and files, uninstalled)
        env:
          SHOTS_DIR: shots
        run: python test/default_browser.py
      # One click: a clean install, and over 0.1.4 put in a folder of its own
      # by the old installer, as the updater and as a person run it.
      - name: One-click installer (clean, over 0.1.4 in its own folder, uninstalled)
        if: always()
        run: python test/installer_oneclick.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-browser
          path: shots/
