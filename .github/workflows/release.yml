name: release

# A tag v<version> (the version in package.json) builds the Windows installers
# for x64 and ARM and publishes them to a GitHub Release with latest.yml, the
# file Oriel's updater reads (electron-updater).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # koffi's prebuilt binary for the other architecture too (npm only
      # installs the one of the machine it runs on).
      - run: npm install --no-save --force @koromix/koffi-win32-x64@3.3.8 @koromix/koffi-win32-arm64@3.3.8
      - run: npm run licenses
      - run: npm run build
      # One release for every file: electron-builder's targets upload at once and
      # would each create their own release if none existed yet.
      - name: Make the release first
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Oriel ${tag#v}" --notes "Building…"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --arm64 --publish always
